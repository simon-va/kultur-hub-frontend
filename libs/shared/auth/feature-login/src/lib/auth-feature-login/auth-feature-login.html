<div class="login-wrapper">
  <p-card class="login-card">
    <p-button
      icon="pi pi-arrow-left"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      class="back-button"
      (onClick)="router.navigate(['/willkommen'])"
    />
    <h1 class="login-title">KiBuU-Portal</h1>

    @if (errorMessage()) {
      <p-message severity="error" class="login-error">{{ errorMessage() }}</p-message>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <label for="email">E-Mail</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Passwort</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
        />
      </div>

      <p-button
        type="submit"
        label="Anmelden"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </form>
  </p-card>
</div>
