<lib-portal-header />

<main>
  @if (loadError()) {
    <div class="portal-error">
      <i class="pi pi-exclamation-circle" style="font-size: 2rem"></i>
      <h2>Ein Fehler ist aufgetreten</h2>
      <p>Die Seite konnte nicht geladen werden.</p>
      <p-button label="Erneut versuchen" (click)="retryNavigation()" />
    </div>
  } @else {
    <router-outlet />
  }
</main>
