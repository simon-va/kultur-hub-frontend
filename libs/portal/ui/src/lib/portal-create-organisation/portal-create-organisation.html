<div class="tab setup-page">
  <h2>Willkommen im Portal!</h2>
  <p>Erstelle zunächst eine Organisation, um loszulegen.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">Name der Organisation</label>
      <input pInputText id="name" formControlName="name" />
    </div>

    <p-button
      type="submit"
      label="Organisation erstellen"
      [loading]="loading()"
      [disabled]="form.invalid"
    />
  </form>
</div>
